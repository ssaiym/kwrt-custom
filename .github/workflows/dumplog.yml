name: Dump Failed Log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Fetch failed job log and commit the tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOBID=132370832023
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/jobs/$JOBID/logs" -o compile.log
          {
            echo "log_bytes=$(wc -c < compile.log)"
            echo "--- all ustream mentions ---"
            grep -an "ustream-ssl" compile.log | tail -12 || true
            echo "--- ustream V=s error detail ---"
            grep -aE "ustream|libustream" compile.log | grep -aiE "error|fail|undefined|missing" | tail -10 || true
            echo "--- .config selections ---"
            grep -aE "CONFIG_PACKAGE_(xray-core|libustream-mbedtls|ustream-ssl|v2ray|nginx-ssl|uhttpd|luci-nginx|curl|libopenssl|sing-box|luci-app-passwall2_Basic)[= ]" compile.log | head -16 || true
            echo "--- golang variants used ---"
            grep -aoE "golang1?\.?2[67]?/host" compile.log | sort | uniq -c | head -6 || true
          } > logtail.txt
          git config user.email "bot@kwrt.local"
          git config user.name "logbot"
          git add logtail.txt
          git commit -m "ci: dump compile log tail (job $JOBID)"
          git push
