name: Dump Failed Log / Publish Firmware

on:
  workflow_dispatch:
    inputs:
      jobid:
        description: "Job ID to dump logs from (empty = latest failed run)"
        required: false
        default: ""
      publish_run:
        description: "Build run ID to publish as a Release (empty = only dump logs)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Dump failed job log
        if: github.event.inputs.publish_run == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOBID="${{ github.event.inputs.jobid }}"
          if [ -z "$JOBID" ]; then
            JOBID=$(curl -sL -H "Authorization: token $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?per_page=5&status=failure" | \
              grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*')
          fi
          echo "dumping job $JOBID"
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/jobs/$JOBID/logs" -o compile.log
          echo "log_bytes=$(wc -c < compile.log)"
          grep -aE "CONFIG_PACKAGE_(libustream[-a-z0-9]*|ustream-ssl[-a-z0-9]*|uhttpd[a-z-]*|nginx[a-z-]*|wget-ssl|libmbedtls|libopenssl|libwolfssl|mbedtls[a-z-]*|wolfssl|openssl)[-= ]" compile.log > config-ssl.txt || true
          grep -aA8 "variables are used in this project" compile.log > cmake-notfound.txt || true
          {
            echo "job=$JOBID log_bytes=$(wc -c < compile.log)"
            echo "=== ssl-related config selections ==="
            sort -u config-ssl.txt || true
            echo "=== cmake NOTFOUND details ==="
            cat cmake-notfound.txt || true
            echo "=== toolchain / go errors ==="
            grep -aiE "go(mod)? (mod )?requires go|GOTOOLCHAIN|golang[0-9.]*|toolchain" compile.log | tail -20 || true
            echo "=== generic errors (last 40) ==="
            grep -aiE "error:|Error |FAILED|failed|undefined reference|cannot find|No such file" compile.log | tail -40 || true
            echo "=== package mentions near failures ==="
            grep -aB2 -A2 "make.*failed" compile.log | tail -40 || true
            echo "=== last 60 raw lines ==="
            tail -60 compile.log
          } > logtail.txt
          cp compile.log compile-log.txt || true
          wc -c logtail.txt
          git config user.email "bot@kwrt.local"
          git config user.name "logbot"
          git add logtail.txt compile-log.txt || git add logtail.txt || true
          git commit -m "ci: dump compile log tail (job $JOBID)" || true
          git pull --rebase || true
          git push

      - name: Download build artifacts
        if: github.event.inputs.publish_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.inputs.publish_run }}
        run: |
          set -eu
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -o artifacts.json
          python3 -c 'import json;[print(a["id"],a["name"],a["size_in_bytes"]) for a in json.load(open("artifacts.json")).get("artifacts",[])]' > artifact_list.txt
          cat artifact_list.txt
          mkdir -p zips
          while read -r id name size; do
            echo "downloading $name ($id, $size bytes)"
            curl -sL -H "Authorization: token $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${id}/zip" \
              -o "zips/${name}.zip"
            ls -lh "zips/${name}.zip"
          done < artifact_list.txt

      - name: Extract AX3000T stock image
        if: github.event.inputs.publish_run != ''
        run: |
          set -eu
          mkdir -p work out
          for z in zips/*.zip; do
            unzip -o -q "$z" -d work || echo "warn: $z"
          done
          echo "=== candidate files ==="
          find work -type f \( -name '*.bin' -o -name '*.manifest' \) | head -40
          echo "=== copying stock-layout AX3000T image (exclude ubootmod) ==="
          find work -type f -name '*xiaomi_mi-router-ax3000t*sysupgrade*.bin' ! -name '*ubootmod*' -exec cp -v {} out/ \;
          find work -type f -name '*xiaomi_mi-router-ax3000t*.manifest' ! -name '*ubootmod*' -exec cp -v {} out/ \; || true
          ls -lh out/ || true

      - name: Publish to release
        if: github.event.inputs.publish_run != ''
        uses: softprops/action-gh-release@master
        with:
          files: out/*
          name: "AX3000T firmware (build ${{ github.event.inputs.publish_run }})"
          tag_name: "ax3000t-${{ github.event.inputs.publish_run }}"
          body: |
            Xiaomi Mi Router AX3000T - stock layout sysupgrade image.
            Includes luci-app-wifiproxy (WiFi Proxy Matrix, zh_Hans), luci-app-passwall v1 (sing-box),
            passwall2, tailscale, zerotier, frpc, wireguard.

            Flash: Kwrt web UI -> System -> Backup/Flash Firmware, uncheck "keep settings".
