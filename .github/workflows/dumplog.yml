name: Dump Failed Log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Fetch failed job log and commit the tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOBID=132370832023
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/jobs/$JOBID/logs" -o compile.log
          {
            echo "log_bytes=$(wc -c < compile.log)"
            echo "--- ustream error block full ---"
            grep -B80 "ustream-ssl failed to build" compile.log | grep -avE "PATH=/home|CGO_|GOCACHE|^2026.*(Downloading|Connecting|Waiting)" | tail -45 || true
            echo "--- .config selections ---"
            grep -aE "^CONFIG_PACKAGE_(xray-core|libustream-mbedtls|ustream-ssl|v2ray|nginx-ssl|uhttpd|luci-nginx|curl|libopenssl|sing-box|golang)[= ]" compile.log | head -16 || true
          } > logtail.txt
          git config user.email "bot@kwrt.local"
          git config user.name "logbot"
          git add logtail.txt
          git commit -m "ci: dump compile log tail (job $JOBID)"
          git push
