name: Dump Failed Log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Fetch failed job log and commit the tail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOBID=132370832023
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/jobs/$JOBID/logs" -o compile.log
          {
            echo "log_bytes=$(wc -c < compile.log)"
            echo "--- go toolchain errors ---"
            grep -aE "requires go|go: |fatal error|note: module requires|GOTOOLCHAIN" compile.log | grep -av "PATH=/home" | grep -av "CGO" | tail -12 || true
            echo "--- xray build error block ---"
            grep -B12 "Xray-core-26.11.9/.built] Error 1" compile.log | grep -avE "PATH=/home|CGO_|GOCACHE|GOMODCACHE|GOENV|GO_BUILD|GO_MOD" | tail -14 || true
            echo "--- ustream error block ---"
            grep -B15 "ustream-ssl failed to build" compile.log | grep -aE "error|Error|mbedtls|mbed" | tail -10 || true
            echo "--- .config selections ---"
            grep -aE "^CONFIG_PACKAGE_(xray-core|libustream-mbedtls|ustream-ssl|v2ray|nginx-ssl|uhttpd|luci-nginx|curl|libopenssl|sing-box)[= ]" compile.log | head -16 || true
          } > logtail.txt
          git config user.email "bot@kwrt.local"
          git config user.name "logbot"
          git add logtail.txt
          git commit -m "ci: dump compile log tail (job $JOBID)"
          git push
