name: Publish Firmware to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose artifacts to publish"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts of the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -eu
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -o artifacts.json
          python3 -c "
import json
d = json.load(open('artifacts.json'))
for a in d.get('artifacts', []):
    print(a['id'], a['name'], a['size_in_bytes'])
" > artifact_list.txt
          cat artifact_list.txt
          mkdir -p zips
          while read -r id name size; do
            echo "downloading $name ($id)"
            curl -sL -H "Authorization: token $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${id}/zip" \
              -o "zips/${name}.zip"
            ls -lh "zips/${name}.zip"
          done < artifact_list.txt

      - name: Extract and select AX3000T stock image
        run: |
          set -eu
          mkdir -p work out
          for z in zips/*.zip; do
            unzip -o -q "$z" -d work || echo "warn: $z"
          done
          echo "=== candidate images ==="
          find work -type f \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' \) | head -40
          echo "=== copying stock-layout AX3000T image ==="
          # stock layout filename: ...xiaomi_mi-router-ax3000t-squashfs-sysupgrade.bin
          # explicitly exclude the ubootmod variant
          find work -type f -name '*xiaomi_mi-router-ax3000t*sysupgrade*.bin' \
            ! -name '*ubootmod*' -exec cp -v {} out/ \;
          find work -type f -name '*xiaomi_mi-router-ax3000t*.manifest' \
            ! -name '*ubootmod*' -exec cp -v {} out/ \; || true
          echo "=== result ==="
          ls -lh out/ || true

      - name: Verify image exists
        run: |
          set -eu
          test -n "$(ls -A out/*.bin 2>/dev/null)" || {
            echo "ERROR: no .bin produced. ARTIFACT CONTENTS:"
            find work -maxdepth 5 -type d | head -40
            echo "--- all files (first 60) ---"
            find work -type f | head -60
            exit 1
          }

      - name: Publish to release
        uses: softprops/action-gh-release@master
        with:
          files: out/*
          name: "AX3000T firmware (build run ${{ github.event.inputs.run_id }})"
          tag_name: "ax3000t-run${{ github.event.inputs.run_id }}"
          body: |
            Xiaomi Mi Router AX3000T - stock layout sysupgrade image.
            Contains luci-app-wifiproxy (WiFi Proxy Matrix, zh_Hans) + luci-app-passwall v1 (sing-box)
            + passwall2 + tailscale + zerotier + frpc + wireguard.

            Flash via Kwrt web UI: System -> Backup/Flash Firmware, uncheck "keep settings".
